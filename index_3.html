  :root{
    --bg:#0a0e12;
    --panel:#12181f;
    --line:#1f2933;
    --lcd:#0d1a12;
    --lcd-glow:#00e07a;
    --lcd-dim:#0f5c3a;
    --amber:#ffb703;
    --amber-dim:#7a5600;
    --road:#20272f;
    --ink:#c8d3dc;
    --muted:#5a6b78;
    --red:#ff4d4d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex;justify-content:center;
    min-height:100vh;
  }
  .app{
    width:100%;max-width:480px;
    display:flex;flex-direction:column;
    min-height:100vh;
    background:
      radial-gradient(120% 60% at 50% -10%, #16202a 0%, transparent 60%),
      var(--bg);
  }

  /* top plate */
  .plate{
    padding:18px 20px 6px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    border-bottom:1px solid var(--line);
  }
  .badge{
    font-weight:800;letter-spacing:2px;font-size:13px;
    color:var(--amber);
  }
  .badge span{color:var(--muted);font-weight:600;letter-spacing:1px}
  .clock{
    font-family:'DSEG7',"Courier New",monospace;font-variant-numeric:tabular-nums;
    font-size:clamp(38px, 15vw, 54px);font-weight:700;letter-spacing:1px;color:var(--lcd-glow);
    text-shadow:0 0 14px rgba(0,224,122,.5);line-height:1.15;
  }
  .statusbar{padding:0 20px 12px;display:flex;justify-content:center;border-bottom:1px solid var(--line)}
  .status{
    font-size:11px;letter-spacing:1.5px;font-weight:700;
    padding:5px 10px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);
    display:flex;align-items:center;gap:6px;
  }
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .status.on{color:var(--lcd-glow);border-color:var(--lcd-dim)}
  .status.on .dot{background:var(--lcd-glow);box-shadow:0 0 8px var(--lcd-glow);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}

  /* meter LCD */
  .meter{
    margin:16px;padding:20px;border-radius:14px;
    background:linear-gradient(180deg,#0e1712,#0a130e);
    border:1px solid #16332a;
    box-shadow:inset 0 0 30px rgba(0,224,122,.06), 0 4px 20px rgba(0,0,0,.4);
  }
  .meter{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .meter-left{min-width:0;flex:1}
  .meter img{width:42%;max-width:170px;max-height:124px;object-fit:contain;flex-shrink:0}
  .fare-label{font-size:11px;letter-spacing:3px;color:var(--lcd-dim);font-weight:700;margin-bottom:6px}
  .fare{
    font-family:'DSEG7',"Courier New",monospace;
    font-variant-numeric:tabular-nums;
    font-size:clamp(20px, 8.6vw, 36px);line-height:1.15;font-weight:700;
    color:var(--lcd-glow);
    text-shadow:0 0 12px rgba(0,224,122,.45);
    display:flex;align-items:baseline;gap:6px;
  }
  .fare .won{font-size:26px;color:var(--lcd-dim);text-shadow:none}
  .fare-cents{font-size:22px;color:var(--lcd-dim);text-shadow:none;margin-left:2px}
  /* 금액 자릿수에 따라 자동 축소 (말에 가리지 않도록) */
  .fare.d4{font-size:clamp(13px, 5.3vw, 26px)}   /* 천원대 + 소수점 */
  .fare.d5{font-size:clamp(17px, 7.1vw, 30px)}   /* 만원대 */
  .fare.d6{font-size:clamp(15px, 6.3vw, 27px)}   /* 십만원대 */
  .fare.d7{font-size:clamp(12px, 4.9vw, 22px)}   /* 백만원 이상 */
  .fare.hidecents .fare-cents{display:none}
  
  /* 달릴 때: 몸통 상하 반동 + 도로 흐름 */

  /* stats row */
  .stats{
    display:grid;grid-template-columns:1fr 1fr;gap:1px;
    margin:0 16px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  }
  .stat{background:var(--panel);padding:12px 12px;min-width:0}
  .stat .k{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:700}
  .stat .v{
    font-family:"Courier New",monospace;font-variant-numeric:tabular-nums;
    font-size:clamp(14px,4.6vw,20px);font-weight:700;color:var(--amber);margin-top:4px;
    white-space:nowrap;overflow:hidden;
  }
  .stat.time .v{color:var(--ink)}
  .stat.countdown .v{color:#ff8c42}
  @keyframes alarmflash{0%,100%{background:var(--bg)}50%{background:#3a1010}}
  body.alarm{animation:alarmflash .5s ease-in-out 10}
  .alarm-banner{
    display:none;position:fixed;top:0;left:0;right:0;z-index:99;
    background:#ff4d4d;color:#2a0808;font-weight:800;font-size:18px;
    text-align:center;padding:16px;letter-spacing:1px;
  }
  body.alarm .alarm-banner{display:block}

  /* controls */
  .controls{padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:auto}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11px;letter-spacing:1.5px;color:var(--muted);font-weight:700}
  .inrow{display:flex;gap:10px}
  .inp{
    flex:1;background:var(--lcd);border:1px solid var(--line);border-radius:10px;
    padding:14px 14px;color:var(--ink);font-size:18px;font-weight:700;
    font-variant-numeric:tabular-nums;outline:none;
  }
  .inp:focus{border-color:var(--lcd-dim)}
  .toggles{display:flex;gap:10px}
  .btn-done{
    flex:0 0 auto;padding:0 18px;border:1px solid var(--lcd-dim);border-radius:10px;
    background:#12241a;color:var(--lcd-glow);font-size:14px;font-weight:800;cursor:pointer;
  }
  .btn-done:active{transform:scale(.97);background:#1a3326}
  .chip{
    flex:1;text-align:center;padding:12px;border-radius:10px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);
    font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--muted);
    user-select:none;transition:.15s;
  }
  .chip small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:3px;letter-spacing:0}
  .chip.active{background:#1a2620;border-color:var(--lcd-dim);color:var(--lcd-glow)}
  .chip.active small{color:var(--lcd-dim)}

  .btns{display:flex;gap:10px;margin:12px 16px 0}
  .btn{
    flex:1;padding:18px;border:none;border-radius:12px;cursor:pointer;
    font-size:16px;font-weight:800;letter-spacing:1px;
  }
  .btn-start{background:var(--lcd-glow);color:#03210f}
  .btn-end{background:var(--amber);color:#2a1c00;flex:0 0 auto;padding-left:22px;padding-right:22px}
  .btn-end:active{transform:scale(.98)}
  .btn-start:active{transform:scale(.98)}
  .btn-start.running{background:var(--red);color:#2a0808}
  .btn-reset{
    flex:0 0 auto;padding:18px 22px;background:var(--panel);
    border:1px solid var(--line);color:var(--muted);
    font-size:14px;font-weight:700;border-radius:12px;cursor:pointer;
  }
  .hint{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.5px;padding-bottom:8px}
  /* 광고 영역 (무료판): AdMob 표준 배너 320x50 규격 */
  #adBar{
    width:100%;height:52px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:#0f151b;border-bottom:1px solid var(--line);
    color:#3a4a56;font-size:11px;letter-spacing:2px;font-weight:700;
  }
  body.pro #adBar{display:none}
  /* 무료판(광고 있음): 행간 압축으로 광고 높이만큼 보상 */
  body:not(.pro) .plate{padding:8px 20px 2px;gap:4px}
  body:not(.pro) .clock{font-size:clamp(36px, 14.4vw, 52px)}
  body:not(.pro) .statusbar{padding:0 20px 8px}
  body:not(.pro) .meter{margin:10px 16px;padding:14px 20px}
  body:not(.pro) .controls{padding:10px 16px;gap:8px}
  body:not(.pro) .stat{padding:9px 12px}

  /* 환산 표시 */
  .convert{font-size:12px;color:var(--lcd-dim);margin-top:6px;letter-spacing:.5px;min-height:15px}

  /* 목표 레이스 */
  .race{margin:12px 16px 0;padding:10px 14px;background:var(--panel);
        border:1px solid var(--line);border-radius:12px}
  .race-info{display:flex;justify-content:space-between;font-size:11px;
             color:var(--muted);font-weight:700;letter-spacing:1px;margin-bottom:8px}
  .race-info #racePct{color:var(--lcd-glow)}
  .race-track{position:relative;height:22px;background:var(--lcd);border-radius:11px;overflow:visible}
  .race-fill{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:11px;
             background:linear-gradient(90deg,#0f5c3a,#00e07a);transition:width .5s}
  .race-car{position:absolute;top:-3px;left:0;font-size:18px;transform:translateX(-4px);
            transition:left .5s;filter:drop-shadow(0 0 4px rgba(0,224,122,.6))}
  .race-flag{position:absolute;right:2px;top:0;font-size:15px}

  /* 토스트 */
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
         background:#0f2a1a;border:1px solid var(--lcd-dim);color:var(--lcd-glow);
         padding:12px 22px;border-radius:999px;font-weight:800;font-size:15px;
         letter-spacing:.5px;opacity:0;pointer-events:none;z-index:80;
         transition:all .35s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 폭죽 */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
  /* 꽃비: 화면 전체에 꽃잎이 흩날리며 내림 */
  .petal{
    position:absolute; top:-40px;
    will-change:transform,opacity;
    animation:petalfall linear forwards;
  }
  @keyframes petalfall{
    0%   { transform:translate3d(0,0,0) rotate(0deg); opacity:0 }
    8%   { opacity:1 }
    85%  { opacity:1 }
    100% { transform:translate3d(var(--dx), var(--fall), 0) rotate(var(--spin)); opacity:0 }
  }
  /* 가운데 축하 문구 */
  .fx-banner{
    position:fixed; left:50%; top:38%; transform:translate(-50%,-50%) scale(.7);
    z-index:71; pointer-events:none; opacity:0;
    font-size:clamp(22px,7vw,34px); font-weight:900; letter-spacing:1px;
    color:#fff; text-shadow:0 0 18px rgba(255,183,3,.9), 0 0 40px rgba(57,224,122,.7);
    white-space:nowrap;
    animation:bannerpop 2.4s ease-out forwards;
  }
  @keyframes bannerpop{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.6)}
    12%{opacity:1; transform:translate(-50%,-50%) scale(1.12)}
    22%{transform:translate(-50%,-50%) scale(1)}
    78%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0; transform:translate(-50%,-60%) scale(1)}
  }

  /* 영수증 */
  .receipt-wrap{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:90;
                display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
  .receipt-wrap.show{display:flex}
  .receipt{background:#f8f6f0;color:#1a1a1a;width:100%;max-width:310px;
           padding:22px 20px 26px;font-family:"Courier New",monospace;
           font-size:13px;line-height:1.75;box-shadow:0 10px 40px rgba(0,0,0,.6);
           position:relative}
  .receipt::after{content:'';position:absolute;left:0;right:0;bottom:-9px;height:10px;
    background:linear-gradient(-45deg,transparent 6px,#f8f6f0 0) 0 0/14px 100%,
               linear-gradient(45deg,transparent 6px,#f8f6f0 0) 7px 0/14px 100%;
    background-repeat:repeat-x}
  .receipt .r-title{text-align:center;font-weight:700;font-size:15px;letter-spacing:3px;margin-bottom:4px}
  .receipt .r-date{text-align:center;font-size:11px;color:#666;margin-bottom:8px}
  .receipt .r-line{border-top:1.5px dashed #999;margin:8px 0}
  .receipt .r-row{display:flex;justify-content:space-between}
  .receipt .r-total{font-weight:700;font-size:17px}
  .receipt .r-foot{text-align:center;font-size:11.5px;color:#555;margin-top:10px}
  .receipt .r-serial{text-align:center;font-size:10.5px;color:#888;margin-top:8px;letter-spacing:.5px}
  .receipt .r-brand{text-align:center;font-size:10px;color:#999;letter-spacing:2px;margin-top:4px}
  .receipt-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .btn-receipt{
    padding:13px 16px;border:none;border-radius:10px;cursor:pointer;
    font-size:14px;font-weight:800;letter-spacing:.3px;
  }
  .btn-cert{background:var(--lcd-glow);color:#03210f}
  .btn-save{background:var(--amber);color:#2a1c00}
  .btn-receipt:active{transform:scale(.97)}

  /* 기록 달력 */
  .history{margin:14px 16px 0;padding:14px;background:var(--panel);
           border:1px solid var(--line);border-radius:12px}
  .h-title{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-bottom:10px;
           display:flex;justify-content:space-between}
  .h-title span{color:var(--amber);font-family:"Courier New",monospace}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .dow{font-size:9px;color:var(--muted);text-align:center;font-weight:700}
  .cal .day{aspect-ratio:1;border-radius:5px;background:#0d1a12;
            display:flex;align-items:center;justify-content:center;
            font-size:9px;color:#3a5548;font-variant-numeric:tabular-nums}
  .cal .day.today{outline:1.5px solid var(--lcd-dim)}

  /* ===== 가로 모드: 필수 요소만 크게 (현재수입 · 자동차 · 시간 · START/RESET) ===== */
  @media (orientation:landscape) and (max-height:600px){
    body{align-items:stretch}
    .app{
      max-width:none; width:100%;
      height:100vh; height:100dvh;
      padding:0; overflow:hidden;      /* 스크롤 없이 한 화면에 */
      /* 스탯과 버튼을 같은 줄에 두어 말(미터기)에 세로 공간을 최대로 */
      display:grid;
      grid-template-columns: minmax(0,1fr) auto;
      grid-template-rows: auto auto 1fr auto;
    }
    #adBar{grid-column:1/-1; grid-row:1}
    .plate{grid-column:1/-1; grid-row:2}
    .meter{grid-column:1/-1; grid-row:3}
    .stats{grid-column:1; grid-row:4; align-self:stretch}
    .btns{grid-column:2; grid-row:4; align-self:center; margin:0 12px 0 0}

    /* --- 숨길 것: 부가 기능 (세로 모드에서 사용) --- */
    .statusbar, .race, .history, .hint,
    .controls{ display:none !important; }

    /* --- 상단: 앱명 + 시계 --- */
    .plate{
      flex-shrink:0;
      flex-direction:row; align-items:center; justify-content:space-between;
      padding:3px 16px; gap:10px; border-bottom:1px solid var(--line);
    }
    .badge{font-size:11px}
    .clock{font-size:26px; letter-spacing:0}

    /* --- 중앙: 금액(왼쪽) + 자동차(오른쪽, 크게) --- */
    .meter{
      flex:1 1 auto; min-height:0;
      margin:0; padding:2px 14px;
      display:flex; align-items:center; justify-content:flex-start; gap:12px;
      border-radius:0; border-left:none; border-right:none;
    }
    /* 금액: 말에 공간을 더 주기 위해 최소폭 축소 */
    .meter-left{flex:0 0 auto; min-width:32%}
    .fare{font-size:clamp(34px,9vh,64px); white-space:nowrap}
    .fare .won{font-size:.55em}
    .fare-cents{font-size:.45em}
    .convert{font-size:11px;margin-top:4px;white-space:nowrap}
    /* 자동차: 남는 공간 전부 차지해서 최대한 크게 */
    .meter img{
      flex:1 1 auto;
      width:100%; max-width:none;
      max-height:100%; height:auto;
      object-fit:contain; align-self:center;
    }

    /* --- 하단: 근무시간·초당수입 + 버튼 --- */
    .stats{
      flex-shrink:0;
      grid-template-columns:repeat(auto-fit, minmax(90px,1fr));
      margin:0; border-radius:0; border-left:none; border-right:none; border-bottom:none;
    }
    .stat{padding:3px 8px}
    .stat .k{font-size:9px;letter-spacing:1px}
    .stat .v{font-size:clamp(12px,2.4vh,17px);margin-top:0}

    .btns{gap:8px}
    .btn{padding:10px 22px;font-size:15px;flex:0 0 auto}
    .btn-end{padding:10px 18px}
    .btn-reset{padding:10px 14px;font-size:13px}

    /* 광고: 가로에선 더 얇게 */
    #adBar{height:34px;flex-shrink:0;font-size:10px}
    body:not(.pro) .plate{padding:4px 16px}
    body:not(.pro) .clock{font-size:23px}
  }

  /* 아주 낮은 화면(구형 폰 가로) 대응 */
  @media (orientation:landscape) and (max-height:400px){
    .plate{padding:3px 14px}
    .clock{font-size:20px}
    .badge{font-size:10px}
    .convert{display:none}
    .stat .k{font-size:8px}
    .btn{padding:9px;font-size:14px}
  }
</style>
</head>

<script>
/* ========== 버전 설정 ========== */
const PRO = true;    // true = 유료판(광고 없음), false = 무료판(광고 표시)
if(PRO) document.body.classList.add('pro');

/* ---------- 상태 ---------- */
const state = {
  running:false,
  startEpoch:0,
  accruedMs:0,
  wage:10030,
  night:false,
  holiday:false,
  mode:'hourly',       // 'hourly' | 'salary'
  salary:2500000,
  monthHours:209,
  endTime:'',          // 'HH:MM' 퇴근 시간
  endEpoch:0,          // 확정된 퇴근 시각 (ms)
  goal:0,              // 오늘 목표 금액
  tickOn:false,        // 미터기 딸깍음
  wakeOn:false,        // 화면 켜짐 유지
  loggedMs:0,          // 달력에 이미 기록된 세션 시간
  alarmFired:false,
};

/* ---------- DOM ---------- */
const $ = s=>document.querySelector(s);
const fareMain=$('#fareMain'), fareCents=$('#fareCents');
const elapsedEl=$('#elapsed'), perSecEl=$('#perSec');
const startBtn=$('#startBtn'), resetBtn=$('#resetBtn');
const wageInp=$('#wage'), statusEl=$('#status'), statusText=$('#statusText');
const chipNight=$('#chipNight'), chipHoliday=$('#chipHoliday'), rateHint=$('#rateHint');

/* ---------- 시급/배율 ---------- */
function multiplier(){
  let m=1;
  if(state.night) m*=1.5;
  if(state.holiday) m*=1.5;
  return m;
}
function baseHourly(){
  if(state.mode==='salary'){
    return state.monthHours>0 ? state.salary/state.monthHours : 0;
  }
  return state.wage;
}
function effectiveWage(){
  const m = state.mode==='hourly' ? multiplier() : 1;  // 월급제는 배율 없음
  return baseHourly()*m;
}
function perSecond(){ return effectiveWage()/3600; }

function fmtInt(n){ return Math.floor(n).toLocaleString('ko-KR'); }
function updateHint(){
  if(state.mode==='salary'){
    rateHint.textContent = `실질 시급 ₩${fmtInt(baseHourly())} (실수령 ÷ ${state.monthHours}h) · 초당 ₩${perSecond().toFixed(2)}`;
  }else{
    const m=multiplier(); const eff=effectiveWage();
    const label = m>1 ? `${fmtInt(state.wage)} × ${m}` : `${fmtInt(state.wage)}`;
    rateHint.textContent = `적용 시급 ₩${fmtInt(eff)} (${label}) · 초당 ₩${perSecond().toFixed(2)}`;
  }
}

/* ---------- 경과/금액 ---------- */
function currentMs(){
  return state.accruedMs + (state.running ? Date.now()-state.startEpoch : 0);
}
function render(){
  const ms=currentMs();
  const sec=ms/1000;
  const earned=perSecond()*sec;

  const whole=Math.floor(earned);
  const cents=Math.floor((earned-whole)*100);
  const wholeStr=whole.toLocaleString('ko-KR');
  fareMain.textContent=wholeStr;
  fareCents.textContent='.'+String(cents).padStart(2,'0');
  // 자릿수에 따라 크기 조절 + 만원 이상은 소수점 생략 (말에 가리지 않게)
  const digits=String(whole).length;
  const fareEl=fareMain.parentElement;
  fareEl.classList.toggle('d4', digits===4);
  fareEl.classList.toggle('d5', digits===5);
  fareEl.classList.toggle('d6', digits===6);
  fareEl.classList.toggle('d7', digits>=7);
  fareEl.classList.toggle('hidecents', whole>=10000);

  const t=Math.floor(sec);
  const hh=String(Math.floor(t/3600)).padStart(2,'0');
  const mm=String(Math.floor(t%3600/60)).padStart(2,'0');
  const ss=String(t%60).padStart(2,'0');
  elapsedEl.textContent=`${hh}:${mm}:${ss}`;
  perSecEl.textContent='₩'+perSecond().toFixed(2);
  renderCountdown();
  updateExtras(earned);
}

/* ========== 와우 기능들 ========== */
const convertEl=$('#convert'), toastEl=$('#toast'), fxEl=$('#fx');
const raceBox=$('#raceBox'), raceFill=$('#raceFill'), raceCar=$('#raceCar'),
      raceLabel=$('#raceLabel'), racePct=$('#racePct');
const COFFEE=4500, CHICKEN=23000;
let prevChicken=null, prevTick=null, prevGoalE=null;
let toastTimer=null;

function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);

CASH_SND.volume=0.85;
function playCash(){
  try{ CASH_SND.currentTime=0; CASH_SND.play().catch(()=>{}); }catch(e){}
}

function tickSound(){
  try{
    unlockAudio();
    const t=audioCtx.currentTime;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='square'; o.frequency.value=1350;
    g.gain.setValueAtTime(0.06,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.03);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+0.04);
  }catch(e){}
}

function fireworks(){
  const W=innerWidth, H=innerHeight;
  const PETALS=['🌸','🌼','🌺','✨','🎉','💐','🌷'];
  const COUNT = Math.min(90, Math.max(45, Math.round(W/6)));   // 화면 넓이에 비례

  for(let i=0;i<COUNT;i++){
    const el=document.createElement('div');
    el.className='petal';
    el.textContent = PETALS[Math.floor(Math.random()*PETALS.length)];
    // 가로 전체에 고르게 분포
    const x = (i/COUNT)*W + (Math.random()-0.5)*(W/COUNT)*2;
    el.style.left = x+'px';
    el.style.fontSize = (14+Math.random()*22)+'px';
    // 낙하 거리·좌우 흔들림·회전
    el.style.setProperty('--fall', (H+120)+'px');
    el.style.setProperty('--dx', ((Math.random()-0.5)*180)+'px');
    el.style.setProperty('--spin', (360+Math.random()*720)*(Math.random()<0.5?-1:1)+'deg');
    const dur = 2.4 + Math.random()*2.2;                       // 2.4~4.6초
    el.style.animationDuration = dur+'s';
    el.style.animationDelay = (Math.random()*1.1)+'s';         // 순차적으로 흩날림
    fxEl.appendChild(el);
    setTimeout(()=>el.remove(), (dur+1.3)*1000);
  }

  // 가운데 축하 문구
  const banner=document.createElement('div');
  banner.className='fx-banner';
  banner.textContent='🎉 목표 달성!';
  document.body.appendChild(banner);
  setTimeout(()=>banner.remove(), 2600);

  // 축하음
  try{
    unlockAudio();
    const t=audioCtx.currentTime;
    [523,659,784,1047].forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*0.13);
      g.gain.exponentialRampToValueAtTime(0.16,t+i*0.13+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.13+0.42);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t+i*0.13); o.stop(t+i*0.13+0.5);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([60,40,60,40,120]);
}

function updateExtras(e){
  // 1) 환산: 커피·치킨
  const cof=(e/COFFEE).toFixed(1), chk=(e/CHICKEN).toFixed(1);
  convertEl.textContent = e>=100 ? `≈ ☕ ${cof}잔 · 🍗 ${chk}마리` : '';
  // 치킨 마일스톤
  const cN=Math.floor(e/CHICKEN);
  if(prevChicken!==null && cN>prevChicken && state.running){
    toast(`🍗 치킨 ${cN}마리 달성!`);
  }
  prevChicken=cN;
  // 2) 현금 소리: 10,000원마다
  const h=Math.floor(e/10000);
  if(prevTick!==null && state.tickOn && state.running && h>prevTick) playCash();
  prevTick=h;
  // 3) 목표 레이스
  if(state.goal>0){
    raceBox.style.display='';
    const pct=Math.min(100, e/state.goal*100);
    raceFill.style.width=pct+'%';
    raceCar.style.left=`calc(${pct}% - 6px)`;
    raceLabel.textContent='목표 ₩'+fmtInt(state.goal);
    racePct.textContent=Math.floor(pct)+'%';
    if(prevGoalE!==null && prevGoalE<state.goal && e>=state.goal){
      fireworks();
      toast('🎉 목표 달성! ₩'+fmtInt(state.goal));
    }
    prevGoalE=e;
  }else{
    raceBox.style.display='none';
    prevGoalE=null;
  }
}

function receiptSerial(d, earned){
  // 인증번호: 날짜 + 금액 기반 (같은 영수증이면 항상 같은 번호)
  const base = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  const h = (base ^ Math.floor(earned) ^ (d.getHours()*3600+d.getMinutes()*60+d.getSeconds())) >>> 0;
  const s = h.toString(36).toUpperCase().padStart(6,'0').slice(-6);
  return `PM-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${s}`;
}

      o.type='square';
      o.frequency.value=140+Math.random()*70;
      const vol=0.05+Math.random()*0.03;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.020);
      o.connect(f); f.connect(g); g.connect(master);
      o.start(t); o.stop(t+0.026);
    }

    // 2) 완료음: 맑은 2음 (띵-딩)
    const done=t0+PULSES*STEP+0.06;
    [{f:988,d:0.10},{f:1319,d:0.36}].forEach((n,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='triangle'; o.frequency.value=n.f;
      const t=done+i*0.11;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.20,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t+n.d);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+n.d+0.05);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([12,26,12,26,12,26,12,60]);
}

/* ===== 영수증을 이미지로 그리기 (저장·공유용) ===== */
function renderReceiptCanvas(){
  if(!lastReceipt) return null;
  const R=lastReceipt, S=2, W=340*S, PAD=26*S;
  const cv=document.createElement('canvas');
  const ctx=cv.getContext('2d');

  const lines=[];
  const push=(type,a,b,opt)=>lines.push({type,a,b,opt:opt||{}});
  push('title','페 이 미 터');
  push('sub',R.dateStr);
  push('hr');
  push('row','근무 시간',R.workTime);
  push('row','적용 단가',R.wageLabel);
  push('row','초당 수입','₩'+R.perSec);
  push('hr');
  push('row','총 수입','₩'+fmtInt(R.earned),{big:true});
  push('row','환산',`커피 ${R.coffee}잔 · 치킨 ${R.chicken}마리`,{small:true});
  push('hr');
  push('quote','"'+R.quote+'"');
  push('serial','인증번호 '+R.serial);
  push('brand','PAY METER');

  // ── 1단계: 측정 (실제로 그리지 않고 높이만 계산)
  function pass(draw){
    let y=PAD;
    for(const L of lines){
      if(L.type==='title'){
        if(draw){ ctx.fillStyle='#1a1a1a'; ctx.font=`bold ${17*S}px "Courier New",monospace`;
          ctx.textAlign='center'; ctx.fillText(L.a,W/2,y); }
        y+=25*S;
      } else if(L.type==='sub'){
        if(draw){ ctx.fillStyle='#666'; ctx.font=`${11*S}px "Courier New",monospace`;
          ctx.textAlign='center'; ctx.fillText(L.a,W/2,y); }
        y+=22*S;
      } else if(L.type==='hr'){
        if(draw){ ctx.strokeStyle='#8a8a8a'; ctx.lineWidth=1.5*S; ctx.setLineDash([5*S,4*S]);
          ctx.beginPath(); ctx.moveTo(PAD,y+7*S); ctx.lineTo(W-PAD,y+7*S); ctx.stroke(); ctx.setLineDash([]); }
        y+=19*S;
      } else if(L.type==='row'){
        const big=L.opt.big, small=L.opt.small;
        if(draw){
          ctx.fillStyle=small?'#666':'#1a1a1a';
          ctx.font=`${big?'bold ':''}${(big?17:(small?11:13.5))*S}px "Courier New",monospace`;
          ctx.textAlign='left';  ctx.fillText(L.a,PAD,y);
          ctx.textAlign='right'; ctx.fillText(L.b,W-PAD,y);
        }
        y+= (big?30:(small?22:26))*S;
      } else if(L.type==='quote'){
        ctx.font=`${12*S}px "Courier New",monospace`;
        const maxW=W-PAD*2;
        const chars=[...L.a]; let line=''; const out=[];
        for(const c of chars){
          const t=line+c;
          if(ctx.measureText(t).width>maxW && line){ out.push(line); line=c; } else line=t;
        }
        out.push(line);
        if(draw){ ctx.fillStyle='#555'; ctx.textAlign='center'; }
        for(const o of out){ if(draw) ctx.fillText(o,W/2,y); y+=19*S; }
        y+=6*S;
      } else if(L.type==='serial'){
        if(draw){ ctx.fillStyle='#888'; ctx.font=`${10.5*S}px "Courier New",monospace`;
          ctx.textAlign='center'; ctx.fillText(L.a,W/2,y); }
        y+=19*S;
      } else if(L.type==='brand'){
        if(draw){ ctx.fillStyle='#aaa'; ctx.font=`${9.5*S}px "Courier New",monospace`;
          ctx.textAlign='center'; ctx.fillText(L.a,W/2,y); }
        y+=15*S;
      }
    }
    return y;
  }

  const contentH=pass(false);
  cv.width=W; cv.height=Math.round(contentH+PAD);
  // 배경
  ctx.fillStyle='#f8f6f0'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.textBaseline='top';
  pass(true);
  return cv.toDataURL('image/png');
}

async function shareReceiptImage(){

/* ========== 기록 달력 ========== */
const calEl=$('#cal'), monthTotalEl=$('#monthTotal');
function loadHist(){ try{return JSON.parse(localStorage.getItem('wageMeterHistory')||'{}')}catch(e){return{}} }
function saveHist(h){ try{localStorage.setItem('wageMeterHistory',JSON.stringify(h))}catch(e){} }
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function logEarnings(){
  const ms=currentMs();
  const delta=ms-(state.loggedMs||0);
  if(delta<1000) return;
  const earned=perSecond()*(delta/1000);
  const h=loadHist();
  h[todayKey()]=(h[todayKey()]||0)+earned;
  saveHist(h);
  state.loggedMs=ms;
  renderCalendar();
}
function renderCalendar(){
  const h=loadHist();
  const d=new Date(), y=d.getFullYear(), m=d.getMonth();
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const prefix=`${y}-${String(m+1).padStart(2,'0')}-`;
  let maxV=0, total=0;
  for(let i=1;i<=days;i++){
    const v=h[prefix+String(i).padStart(2,'0')]||0;
    maxV=Math.max(maxV,v); total+=v;
  }
  let out='';
  for(const w of ['일','월','화','수','목','금','토']) out+=`<div class="dow">${w}</div>`;
  for(let i=0;i<first;i++) out+='<div></div>';
  const today=d.getDate();
  for(let i=1;i<=days;i++){
    const v=h[prefix+String(i).padStart(2,'0')]||0;
    const alpha=maxV>0? (v/maxV)*0.85 : 0;
    const bg=v>0? `rgba(57,224,122,${(0.12+alpha).toFixed(2)})` : '';
    const col=v>0? '#052012':'';
    out+=`<div class="day${i===today?' today':''}" style="${bg?`background:${bg};color:${col};font-weight:700`:''}" title="₩${fmtInt(v)}">${i}</div>`;
  }
  calEl.innerHTML=out;
  monthTotalEl.textContent= total>0 ? '₩'+fmtInt(total) : '아직 없음';
}


/* ---------- 퇴근 카운트다운 & 알람 ---------- */
const cdBox=$('#cdBox'), cdLeft=$('#cdLeft'), cdEarnBox=$('#cdEarnBox'), cdEarn=$('#cdEarn');

// 목표 시각을 '설정 시점에 한 번만' 확정 (매번 재계산하면 지나는 순간 내일로 점프해 알람이 안 울림)
function computeEndEpoch(){
  if(!state.endTime) { state.endEpoch=0; return; }
  const [h,mn]=state.endTime.split(':').map(Number);
  const t=new Date(); t.setHours(h,mn,0,0);
  if(t.getTime()<=Date.now()) t.setDate(t.getDate()+1);   // 설정 시점 기준으로만 다음날 판단
  state.endEpoch=t.getTime();
}

function renderCountdown(){
  if(!state.endTime || !state.endEpoch){ cdBox.style.display='none'; cdEarnBox.style.display='none'; return; }
  cdBox.style.display=''; cdEarnBox.style.display='';
  const left=state.endEpoch-Date.now();          // 확정된 시각 기준 (재계산 없음)
  const t=Math.max(0, Math.floor(left/1000));
  const hh=String(Math.floor(t/3600)).padStart(2,'0');
  const mm=String(Math.floor(t%3600/60)).padStart(2,'0');
  const ss=String(t%60).padStart(2,'0');
  cdLeft.textContent=`${hh}:${mm}:${ss}`;
  cdEarn.textContent='₩'+fmtInt(perSecond()*t);
  // 시간 도달 → 알람 (미터기 작동 여부와 무관하게 울림)
  if(left<=0 && !state.alarmFired){
    state.alarmFired=true;
    fireAlarm();
  }
}

/* 알람: 소리 + 진동 + 화면 깜빡임 + 자동 정지 */
let audioCtx=null;
function unlockAudio(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function beep(t0,freq,dur){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='square'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.001,t0);
  g.gain.exponentialRampToValueAtTime(0.4,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
function fireAlarm(){
  logEarnings();
  stop();
  showReceipt();                                   // 미터기 자동 정지
  try{
    unlockAudio();
    const now=audioCtx.currentTime;
    for(let i=0;i<6;i++){                   // 삐-삐-삐 6회
      beep(now+i*0.5, 880, 0.18);
      beep(now+i*0.5+0.22, 1320, 0.18);
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([400,200,400,200,400,200,400]);
  document.body.classList.add('alarm');
  setTimeout(()=>document.body.classList.remove('alarm'), 6000);
}

/* ---------- 루프 (금액/시간만 갱신) ---------- */
let raf=null;
function loop(){ render(); raf=requestAnimationFrame(loop); }

/* ---------- 컨트롤 ---------- */
function start(){
  unlockAudio();          // 사용자 조작 시점에 오디오 활성화 (알람 소리용)
  try{ START_SND.currentTime=0; START_SND.play().catch(()=>{}); }catch(e){}
  if(state.endTime && (!state.endEpoch || state.endEpoch<=Date.now())) computeEndEpoch();
  state.alarmFired=false;
  state.running=true;
  state.startEpoch=Date.now();
  startBtn.textContent='STOP';
  startBtn.classList.add('running');
  statusEl.classList.add('on');
  statusText.textContent='운행중';
  horseRun(true);
  if(state.wakeOn) acquireWakeLock();
  saveSession();
}
function stop(){
  state.accruedMs=currentMs();
  state.running=false;
  startBtn.textContent='START';
  startBtn.classList.remove('running');
  statusEl.classList.remove('on');
  statusText.textContent='정지';
  horseRun(false);
  releaseWakeLock();
  saveSession();
}
startBtn.onclick=()=>{
  if(state.running){ logEarnings(); stop(); }   // 일시정지 (영수증 없음)
  else start();
};

};

/* ---------- 화면 켜짐 유지 (Wake Lock) ---------- */
const chipWake=$('#chipWake');
let wakeLock=null;

async function acquireWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{ wakeLock=null; });
    }
  }catch(e){ /* 지원 안 하거나 거부됨: 조용히 무시 */ }
}
function releaseWakeLock(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){}
}
// 화면이 꺼졌다 켜질 때(잠금 자동 해제됨) 러닝 중이면 다시 확보
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && state.wakeOn && state.running) acquireWakeLock();
});

chipWake.onclick=()=>{
  state.wakeOn=!state.wakeOn;
  chipWake.classList.toggle('active');
  if(state.wakeOn && state.running) acquireWakeLock();
  else releaseWakeLock();
  saveSettings();
};

/* ---------- 설정 저장/불러오기 (앱 껐다 켜도 유지) ---------- */
function saveSession(){
  try{
    localStorage.setItem('wageMeterSession', JSON.stringify({
      running:state.running, startEpoch:state.startEpoch, accruedMs:state.accruedMs,
      loggedMs:state.loggedMs
    }));
  }catch(e){}
}
function restoreSession(){
  try{
    const s=JSON.parse(localStorage.getItem('wageMeterSession')||'null');
    if(!s) return;
    state.accruedMs=s.accruedMs||0;
    state.loggedMs=s.loggedMs||0;
    if(s.running && s.startEpoch>0){
      // 앱이 꺼져 있던 시간까지 포함해 이어서 계산 (epoch 기반이라 정확)
      state.running=true;
      state.startEpoch=s.startEpoch;
      startBtn.textContent='STOP';
      startBtn.classList.add('running');
      statusEl.classList.add('on');
      statusText.textContent='운행중';
      horseRun(true);
      if(state.wakeOn) acquireWakeLock();
    }
  }catch(e){}
}

function saveSettings(){
  try{
    localStorage.setItem('wageMeter', JSON.stringify({
      wage:state.wage, night:state.night, holiday:state.holiday,
      mode:state.mode, salary:state.salary, monthHours:state.monthHours,
      endTime:state.endTime, endEpoch:state.endEpoch,
      goal:state.goal, tickOn:state.tickOn, wakeOn:state.wakeOn
    }));
  }catch(e){}
}
function loadSettings(){
  try{
    const s=JSON.parse(localStorage.getItem('wageMeter')||'null');
    if(!s) return;
    if(typeof s.wage==='number'){ state.wage=s.wage; wageInp.value=s.wage; }
    if(s.night){ state.night=true; chipNight.classList.add('active'); }
    if(s.holiday){ state.holiday=true; chipHoliday.classList.add('active'); }
    if(s.mode) state.mode=s.mode;
    if(typeof s.salary==='number'){ state.salary=s.salary; salaryInp.value=s.salary; }
    if(typeof s.monthHours==='number'){ state.monthHours=s.monthHours; monthHoursInp.value=s.monthHours; }
    if(typeof s.goal==='number' && s.goal>0){ state.goal=s.goal; goalInp.value=s.goal; }
    if(s.tickOn){ state.tickOn=true; chipTick.classList.add('active'); }
    if(s.wakeOn){ state.wakeOn=true; chipWake.classList.add('active'); }
    if(s.endTime){
      state.endTime=s.endTime; endTimeInp.value=s.endTime;
      // 저장된 목표가 유효하면 유지, 지났으면 다음 발생으로
      state.endEpoch=(s.endEpoch && s.endEpoch>Date.now()) ? s.endEpoch : 0;
      if(!state.endEpoch) computeEndEpoch();
    }
  }catch(e){}
}

  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  clockEl.textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
tickClock(); setInterval(tickClock,1000);

/* ---------- 초기화 ---------- */
loadSettings();
state.wage=parseFloat(wageInp.value)||0;
applyMode();
restoreSession();
setInterval(saveSession, 10000);   // 10초마다 세션 백업 (강제종료 대비)
setInterval(()=>{ if(state.running) logEarnings(); }, 30000);  // 30초마다 달력 기록
// 트래커 초기화: 복원 직후 현재값 기준 (재실행 시 축하 오발 방지)
{
  const e0=perSecond()*(currentMs()/1000);
  prevChicken=Math.floor(e0/CHICKEN);
  prevTick=Math.floor(e0/10000);
  prevGoalE = state.goal>0 ? e0 : null;
}
renderCalendar();
setInterval(render, 1000);         // 절전으로 애니메이션이 멈춰도 1초마다 갱신·알람 검사
updateHint();
render();
loop();

// 화면 다시 켜졌을 때 정확도 보정 (백그라운드 후 복귀)
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) render(); });
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
